name: doc-search-backend

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: doc_search_user
      POSTGRES_PASSWORD: docsearchPassword
      POSTGRES_DB: doc_search
    ports:
      - "5432:5432"
    volumes:
      - doc_search_db_data:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doc_search_user -d doc_search"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/code

    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://doc_search_user:docsearchPassword@db:5432/doc_search
    depends_on:
      db:
        condition: service_healthy


volumes:
  doc_search_db_data:
